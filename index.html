<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ-Помощник с Поиском и Напоминалками (Голос)</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #f4f6f8; color: #1a1a1a; }
        
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid #ddd; }
        .tab-btn { padding: 0.75rem 1.5rem; border: none; background: none; font-size: 1rem; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; color: #666; font-weight: 500; }
        .tab-btn.active { color: #007bff; border-bottom-color: #007bff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Чат */
        #chat { background: white; border-radius: 12px; padding: 1.25rem; height: 400px; overflow-y: auto; margin-bottom: 1rem; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .msg { margin-bottom: 0.75rem; padding: 0.6rem 1rem; border-radius: 14px; max-width: 85%; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .user { background: #007bff; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .ai { background: #f0f2f5; color: #1a1a1a; border-bottom-left-radius: 4px; }
        .ai.error { background: #fee; color: #c00; }
        
        .input-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .input-row input[type="text"] { flex: 1; padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 10px; font-size: 1rem; outline: none; }
        .input-row input[type="text"]:focus { border-color: #007bff; }
        button { padding: 0.75rem 1.5rem; border: none; background: #007bff; color: white; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: background 0.2s; }
        button:hover:not(:disabled) { background: #0056b3; }
        button:disabled { background: #a0c4e8; cursor: not-allowed; }
        
        .options { display: flex; align-items: center; gap: 1rem; font-size: 0.9rem; color: #555; flex-wrap: wrap; }
        .options label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }

        /* Напоминалки */
        .reminder-form { background: white; padding: 1.25rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid #e0e0e0; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end; }
        .reminder-form .field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; min-width: 140px; }
        .reminder-form label { font-size: 0.8rem; color: #666; font-weight: 500; }
        .reminder-form input, .reminder-form select { padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; background: white; }
        .reminder-form input:focus, .reminder-form select:focus { border-color: #007bff; outline: none; }
        .reminder-form button { height: 42px; white-space: nowrap; }
        
        #reminderList { list-style: none; padding: 0; }
        #reminderList li { background: white; padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e0e0e0; }
        #reminderList li.done { opacity: 0.5; text-decoration: line-through; }
        .reminder-info { display: flex; flex-direction: column; gap: 0.2rem; }
        .reminder-time { font-size: 0.85rem; color: #007bff; font-weight: 600; }
        .reminder-title { font-size: 1rem; }
        .reminder-repeat { font-size: 0.8rem; color: #888; }
        .delete-btn { background: #dc3545; padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 6px; }
        .delete-btn:hover { background: #a71d2a; }

        .status { font-size: 0.85rem; color: #888; margin-top: 0.5rem; }

        /* Всплывающее окно активного напоминания */
        #alertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        #alertBox { background: white; padding: 2rem; border-radius: 16px; text-align: center; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        #alertBox h3 { margin-top: 0; color: #dc3545; }
        #alertBox p { font-size: 1.2rem; margin: 1rem 0; }
        #alertBox button { background: #28a745; font-size: 1.1rem; padding: 1rem 2rem; }
        #alertBox button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2>🤖 Мой ИИ-Помощник</h2>

    <div class="tabs">
        <button class="tab-btn active" data-tab="chatTab">💬 Чат с ИИ</button>
        <button class="tab-btn" data-tab="reminderTab">⏰ Напоминалки</button>
    </div>

    <!-- ВКЛАДКА ЧАТ -->
    <div id="chatTab" class="tab-content active">
        <div id="chat">
            <div class="msg ai">Привет! Я твой ИИ-помощник. Спроси меня о чём угодно. Включи «Веб-поиск», чтобы я мог найти погоду, новости или другие актуальные данные в интернете.</div>
        </div>
        <div class="input-row">
            <input type="text" id="prompt" placeholder="Задайте вопрос (например: какая погода в Москве?)..." autocomplete="off">
            <button id="send" onclick="askAI()">Отправить</button>
        </div>
        <div class="options">
            <label>
                <input type="checkbox" id="webSearchToggle" checked> 🔍 Включить веб-поиск (погода, новости)
            </label>
            <label>
                Модель:
                <select id="modelSelect">
                    <option value="openai/gpt-5.3-chat">GPT-5.3 Chat (с веб-поиском)</option>
                    <option value="openai/gpt-5.6-luna">GPT-5.6 Luna (быстрая)</option>
                </select>
            </label>
        </div>
    </div>

    <!-- ВКЛАДКА НАПОМИНАЛОК -->
    <div id="reminderTab" class="tab-content">
        <div class="reminder-form">
            <div class="field">
                <label>Название (будет озвучено)</label>
                <input type="text" id="remTitle" placeholder="Например: Выпей таблетку фурацилина">
            </div>
            <div class="field">
                <label>Дата и время</label>
                <input type="datetime-local" id="remTime">
            </div>
            <div class="field">
                <label>Повторять сигнал</label>
                <select id="remRepeat">
                    <option value="once">Один раз</option>
                    <option value="minute">Каждую минуту</option>
                    <option value="hour">Каждый час</option>
                    <option value="day">Каждый день</option>
                    <option value="week">Каждую неделю</option>
                    <option value="month">Каждый месяц</option>
                    <option value="year">Каждый год</option>
                </select>
            </div>
            <button onclick="addReminder()">➕ Добавить</button>
        </div>
        <ul id="reminderList"></ul>
        <div class="status" id="reminderStatus">Напоминалки сохраняются в браузере. При срабатывании название будет озвучено.</div>
    </div>

    <!-- Всплывающее окно для остановки сигнала -->
    <div id="alertOverlay">
        <div id="alertBox">
            <h3>⏰ Напоминание</h3>
            <p id="alertText"></p>
            <button onclick="stopAlert()">Ок, я понял</button>
        </div>
    </div>

    <!-- Подключаем Puter.js -->
    <script src="https://js.puter.com/v2/"></script>
    <script>
        // ========== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        // ========== ЧАТ С ИИ ==========
        const chatDiv = document.getElementById('chat');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('send');
        const webSearchToggle = document.getElementById('webSearchToggle');
        const modelSelect = document.getElementById('modelSelect');

        function addMessage(text, role, isError = false) {
            const div = document.createElement('div');
            div.className = `msg ${role}` + (isError ? ' error' : '');
            div.textContent = text;
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
            return div;
        }

        async function askAI() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // Проверка: загрузилась ли библиотека Puter
            if (typeof puter === 'undefined') {
                addMessage('Библиотека ИИ ещё загружается. Подождите пару секунд и попробуйте снова.', 'ai', true);
                return;
            }

            addMessage(prompt, 'user');
            promptInput.value = '';
            sendBtn.disabled = true;

            const aiMsgDiv = addMessage('Думаю...', 'ai');

            try {
                const options = { model: modelSelect.value };

                if (webSearchToggle.checked && modelSelect.value.startsWith('openai/')) {
                    options.tools = [{ type: "web_search" }];
                }

                const response = await puter.ai.chat(prompt, options);

                let responseText;
                if (typeof response === 'string') {
                    responseText = response;
                } else if (response && response.message && response.message.content) {
                    if (Array.isArray(response.message.content)) {
                        responseText = response.message.content.map(c => c.text || '').join('');
                    } else {
                        responseText = response.message.content;
                    }
                } else {
                    responseText = JSON.stringify(response);
                }

                aiMsgDiv.textContent = responseText;

            } catch (e) {
                console.error(e);
                aiMsgDiv.textContent = 'Ошибка: ' + (e.message || 'Не удалось получить ответ.');
                aiMsgDiv.classList.add('error');
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') askAI();
        });

        // ========== НАПОМИНАЛКИ С ОЗВУЧКОЙ ==========
        const STORAGE_KEY = 'my_ai_reminders_v3';
        const reminderListEl = document.getElementById('reminderList');
        const remTitleInput = document.getElementById('remTitle');
        const remTimeInput = document.getElementById('remTime');
        const remRepeatSelect = document.getElementById('remRepeat');
        const statusEl = document.getElementById('reminderStatus');
        const alertOverlay = document.getElementById('alertOverlay');
        const alertText = document.getElementById('alertText');

        // Переменные для управления озвучкой
        let currentAlertReminder = null;
        let repeatIntervalId = null;
        let isSpeakingLoop = false;

        // Загрузка
        let reminders = [];
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) {
                    reminders = parsed.filter(r => r && r.title && r.time);
                }
            }
        } catch (e) { reminders = []; }

        function saveReminders() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
            } catch (e) {
                statusEl.textContent = '⚠️ Не удалось сохранить (приватный режим?). Работает до перезагрузки.';
            }
        }

        // Форматирование текста повтора
        function getRepeatLabel(value) {
            const labels = {
                once: 'Один раз',
                minute: 'Каждую минуту',
                hour: 'Каждый час',
                day: 'Каждый день',
                week: 'Каждую неделю',
                month: 'Каждый месяц',
                year: 'Каждый год'
            };
            return labels[value] || value;
        }

        // Отрисовка
        function renderReminders() {
            reminderListEl.innerHTML = '';
            if (reminders.length === 0) {
                reminderListEl.innerHTML = '<li style="justify-content:center;color:#999;">Нет напоминалок</li>';
                return;
            }
            reminders.sort((a, b) => new Date(a.time) - new Date(b.time));
            reminders.forEach((rem) => {
                const li = document.createElement('li');
                if (rem.done) li.classList.add('done');
                
                const info = document.createElement('div');
                info.className = 'reminder-info';
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'reminder-time';
                try {
                    const d = new Date(rem.time);
                    if (!isNaN(d.getTime())) {
                        timeSpan.textContent = d.toLocaleString('ru-RU', { 
                            day: '2-digit', month: '2-digit', year: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        });
                    } else {
                        timeSpan.textContent = 'Некорректное время';
                    }
                } catch (e) { timeSpan.textContent = 'Ошибка времени'; }
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'reminder-title';
                titleSpan.textContent = rem.title;
                
                const repeatSpan = document.createElement('span');
                repeatSpan.className = 'reminder-repeat';
                repeatSpan.textContent = '🔄 ' + getRepeatLabel(rem.repeat || 'once');
                
                info.appendChild(timeSpan);
                info.appendChild(titleSpan);
                info.appendChild(repeatSpan);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = 'Удалить';
                delBtn.onclick = () => {
                    const realIndex = reminders.findIndex(r => r.title === rem.title && r.time === rem.time);
                    if (realIndex > -1) {
                        reminders.splice(realIndex, 1);
                        saveReminders();
                        renderReminders();
                    }
                };
                
                li.appendChild(info);
                li.appendChild(delBtn);
                reminderListEl.appendChild(li);
            });
        }

        // Добавление
        function addReminder() {
            const title = remTitleInput.value.trim();
            const timeValue = remTimeInput.value;
            const repeat = remRepeatSelect.value;
            
            if (!title) { alert('Введите название'); return; }
            if (!timeValue) { alert('Выберите время'); return; }

            const timestamp = new Date(timeValue).getTime();
            if (isNaN(timestamp)) { alert('Некорректная дата'); return; }
            if (timestamp < Date.now() && repeat === 'once') {
                alert('Время уже прошло. Выберите будущее время или повтор.');
                return;
            }

            reminders.push({ 
                title, 
                time: timeValue,
                repeat: repeat,
                done: false, 
                notified: false,
                lastTriggered: null
            });
            saveReminders();
            renderReminders();
            remTitleInput.value = '';
            remTimeInput.value = '';
            statusEl.textContent = 'Напоминалка добавлена.';
        }

        // ========== ОЗВУЧКА (Web Speech API) ==========
        function speakText(text, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                console.warn('Браузер не поддерживает озвучку');
                if (onEndCallback) onEndCallback();
                return;
            }
            window.speechSynthesis.cancel(); // остановить предыдущее
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            utterance.onend = () => { if (onEndCallback) onEndCallback(); };
            utterance.onerror = (e) => { console.warn('Ошибка озвучки:', e); if (onEndCallback) onEndCallback(); };
            window.speechSynthesis.speak(utterance);
        }

        // Остановить всё
        function stopAlert() {
            window.speechSynthesis.cancel();
            if (repeatIntervalId) {
                clearInterval(repeatIntervalId);
                repeatIntervalId = null;
            }
            isSpeakingLoop = false;
            alertOverlay.style.display = 'none';
            currentAlertReminder = null;
        }

        // Показать окно и начать озвучку с повтором
        function triggerAlert(reminder) {
            if (currentAlertReminder) return; // уже показываем другое
            currentAlertReminder = reminder;
            alertText.textContent = reminder.title;
            alertOverlay.style.display = 'flex';
            
            // Функция, которая произносит текст и планирует следующий повтор
            function speakAndSchedule() {
                if (!currentAlertReminder) return; // остановлено
                isSpeakingLoop = true;
                speakText(reminder.title, () => {
                    // После окончания речи, если всё ещё активно, повторяем
                    if (currentAlertReminder && isSpeakingLoop) {
                        // Небольшая пауза перед повтором, чтобы не было каши
                        setTimeout(() => {
                            if (currentAlertReminder && isSpeakingLoop) {
                                speakAndSchedule();
                            }
                        }, 1000);
                    }
                });
            }
            
            // Начинаем озвучку сразу
            speakAndSchedule();
        }

        // ========== ПРОВЕРКА НАПОМИНАЛОК ==========
        function checkReminders() {
            if (currentAlertReminder) return; // уже показываем, не прерываем
            
            const now = Date.now();
            let changed = false;
            
            for (let i = 0; i < reminders.length; i++) {
                const rem = reminders[i];
                if (rem.done) continue;
                
                const remTime = new Date(rem.time).getTime();
                if (isNaN(remTime)) continue;
                
                // Условие срабатывания
                let shouldTrigger = false;
                
                if (rem.repeat === 'once') {
                    if (!rem.notified && remTime <= now) {
                        shouldTrigger = true;
                        rem.done = true;
                        rem.notified = true;
                    }
                } else {
                    // Для повторяющихся: проверяем, прошло ли время первого срабатывания
                    // и не срабатывало ли уже в текущем периоде
                    if (remTime <= now) {
                        // Если ещё ни разу не срабатывало (lastTriggered null) — срабатываем
                        // Или если с последнего срабатывания прошёл период
                        if (!rem.lastTriggered) {
                            shouldTrigger = true;
                        } else {
                            const period = getPeriodMs(rem.repeat);
                            if (period && (now - rem.lastTriggered) >= period) {
                                shouldTrigger = true;
                            }
                        }
                    }
                }
                
                if (shouldTrigger) {
                    rem.lastTriggered = now;
                    // Для "один раз" ставим done, для повторяющихся не ставим
                    if (rem.repeat === 'once') {
                        rem.done = true;
                    }
                    changed = true;
                    triggerAlert(rem);
                    break; // показываем только одно за раз
                }
            }
            
            if (changed) {
                saveReminders();
                renderReminders();
            }
        }

        // Период в миллисекундах для повторяющихся
        function getPeriodMs(repeat) {
            const periods = {
                minute: 60 * 1000,
                hour: 60 * 60 * 1000,
                day: 24 * 60 * 60 * 1000,
                week: 7 * 24 * 60 * 60 * 1000,
                month: 30 * 24 * 60 * 60 * 1000,
                year: 365 * 24 * 60 * 60 * 1000
            };
            return periods[repeat] || null;
        }

        // Запуск проверки каждую секунду
        setInterval(checkReminders, 1000);

        // Инициализация
        renderReminders();
    </script>
</body>
</html>
