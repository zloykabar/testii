<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Напоминалки с голосовой озвучкой</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f4f6f8; color: #1a1a1a; }

        h2 { display: flex; align-items: center; gap: 0.5rem; }

        /* Форма */
        .reminder-form { background: white; padding: 1.25rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid #e0e0e0; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end; }
        .reminder-form .field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; min-width: 140px; }
        .reminder-form label { font-size: 0.8rem; color: #666; font-weight: 500; }
        .reminder-form input, .reminder-form select { padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; background: white; }
        .reminder-form input:focus, .reminder-form select:focus { border-color: #007bff; outline: none; }
        .reminder-form button { height: 42px; white-space: nowrap; padding: 0.75rem 1.5rem; border: none; background: #007bff; color: white; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: background 0.2s; }
        .reminder-form button:hover { background: #0056b3; }

        /* Список */
        #reminderList { list-style: none; padding: 0; }
        #reminderList li { background: white; padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e0e0e0; }
        #reminderList li.done { opacity: 0.5; text-decoration: line-through; }
        .reminder-info { display: flex; flex-direction: column; gap: 0.2rem; }
        .reminder-time { font-size: 0.85rem; color: #007bff; font-weight: 600; }
        .reminder-title { font-size: 1rem; }
        .reminder-repeat { font-size: 0.8rem; color: #888; }
        .delete-btn { background: #dc3545; padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 6px; border: none; color: white; cursor: pointer; }
        .delete-btn:hover { background: #a71d2a; }

        .status { font-size: 0.85rem; color: #888; margin-top: 0.5rem; }

        /* Всплывающее окно активного напоминания */
        #alertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        #alertBox { background: white; padding: 2rem; border-radius: 16px; text-align: center; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        #alertBox h3 { margin-top: 0; color: #dc3545; }
        #alertBox p { font-size: 1.2rem; margin: 1rem 0; }
        #alertBox button { background: #28a745; font-size: 1.1rem; padding: 1rem 2rem; border: none; color: white; border-radius: 10px; cursor: pointer; }
        #alertBox button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2>⏰ Напоминалки</h2>

    <!-- Форма добавления -->
    <div class="reminder-form">
        <div class="field">
            <label>Название (будет озвучено)</label>
            <input type="text" id="remTitle" placeholder="Например: Выпей таблетку фурацилина">
        </div>
        <div class="field">
            <label>Дата и время</label>
            <input type="datetime-local" id="remTime">
        </div>
        <div class="field">
            <label>Повторять сигнал</label>
            <select id="remRepeat">
                <option value="once">Один раз</option>
                <option value="minute">Каждую минуту</option>
                <option value="hour">Каждый час</option>
                <option value="day">Каждый день</option>
                <option value="week">Каждую неделю</option>
                <option value="month">Каждый месяц</option>
                <option value="year">Каждый год</option>
            </select>
        </div>
        <button onclick="addReminder()">➕ Добавить</button>
    </div>

    <!-- Список напоминалок -->
    <ul id="reminderList"></ul>
    <div class="status" id="reminderStatus">Напоминалки сохраняются в браузере. При срабатывании название будет озвучено и повторено, пока вы не нажмёте «Ок».</div>

    <!-- Всплывающее окно -->
    <div id="alertOverlay">
        <div id="alertBox">
            <h3>⏰ Напоминание</h3>
            <p id="alertText"></p>
            <button onclick="stopAlert()">Ок, я понял</button>
        </div>
    </div>

    <script>
        // ========== НАПОМИНАЛКИ С ОЗВУЧКОЙ ==========
        const STORAGE_KEY = 'my_reminders_v4';
        const reminderListEl = document.getElementById('reminderList');
        const remTitleInput = document.getElementById('remTitle');
        const remTimeInput = document.getElementById('remTime');
        const remRepeatSelect = document.getElementById('remRepeat');
        const statusEl = document.getElementById('reminderStatus');
        const alertOverlay = document.getElementById('alertOverlay');
        const alertText = document.getElementById('alertText');

        // Управление озвучкой
        let currentAlertReminder = null;
        let isSpeakingLoop = false;
        let repeatTimerId = null;

        // Загрузка из localStorage
        let reminders = [];
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) {
                    reminders = parsed.filter(r => r && r.title && r.time);
                }
            }
        } catch (e) { reminders = []; }

        function saveReminders() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
            } catch (e) {
                statusEl.textContent = '⚠️ Не удалось сохранить (приватный режим?). Работает до перезагрузки.';
            }
        }

        function getRepeatLabel(value) {
            const labels = {
                once: 'Один раз',
                minute: 'Каждую минуту',
                hour: 'Каждый час',
                day: 'Каждый день',
                week: 'Каждую неделю',
                month: 'Каждый месяц',
                year: 'Каждый год'
            };
            return labels[value] || value;
        }

        // Отрисовка списка
        function renderReminders() {
            reminderListEl.innerHTML = '';
            if (reminders.length === 0) {
                reminderListEl.innerHTML = '<li style="justify-content:center;color:#999;">Нет напоминалок</li>';
                return;
            }
            reminders.sort((a, b) => new Date(a.time) - new Date(b.time));
            reminders.forEach((rem) => {
                const li = document.createElement('li');
                if (rem.done) li.classList.add('done');

                const info = document.createElement('div');
                info.className = 'reminder-info';

                const timeSpan = document.createElement('span');
                timeSpan.className = 'reminder-time';
                try {
                    const d = new Date(rem.time);
                    if (!isNaN(d.getTime())) {
                        timeSpan.textContent = d.toLocaleString('ru-RU', {
                            day: '2-digit', month: '2-digit', year: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        });
                    } else {
                        timeSpan.textContent = 'Некорректное время';
                    }
                } catch (e) { timeSpan.textContent = 'Ошибка времени'; }

                const titleSpan = document.createElement('span');
                titleSpan.className = 'reminder-title';
                titleSpan.textContent = rem.title;

                const repeatSpan = document.createElement('span');
                repeatSpan.className = 'reminder-repeat';
                repeatSpan.textContent = '🔄 ' + getRepeatLabel(rem.repeat || 'once');

                info.appendChild(timeSpan);
                info.appendChild(titleSpan);
                info.appendChild(repeatSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = 'Удалить';
                delBtn.onclick = () => {
                    const realIndex = reminders.findIndex(r => r.title === rem.title && r.time === rem.time);
                    if (realIndex > -1) {
                        reminders.splice(realIndex, 1);
                        saveReminders();
                        renderReminders();
                    }
                };

                li.appendChild(info);
                li.appendChild(delBtn);
                reminderListEl.appendChild(li);
            });
        }

        // Добавление напоминалки
        function addReminder() {
            const title = remTitleInput.value.trim();
            const timeValue = remTimeInput.value;
            const repeat = remRepeatSelect.value;

            if (!title) { alert('Введите название'); return; }
            if (!timeValue) { alert('Выберите время'); return; }

            const timestamp = new Date(timeValue).getTime();
            if (isNaN(timestamp)) { alert('Некорректная дата'); return; }
            if (timestamp < Date.now() && repeat === 'once') {
                alert('Время уже прошло. Выберите будущее время или повтор.');
                return;
            }

            reminders.push({
                title,
                time: timeValue,
                repeat: repeat,
                done: false,
                notified: false,
                lastTriggered: null
            });
            saveReminders();
            renderReminders();
            remTitleInput.value = '';
            remTimeInput.value = '';
            statusEl.textContent = 'Напоминалка добавлена.';
        }

        // ========== ОЗВУЧКА ==========
        function speakText(text, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                console.warn('Браузер не поддерживает озвучку');
                if (onEndCallback) onEndCallback();
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            utterance.onend = () => { if (onEndCallback) onEndCallback(); };
            utterance.onerror = (e) => { console.warn('Ошибка озвучки:', e); if (onEndCallback) onEndCallback(); };
            window.speechSynthesis.speak(utterance);
        }

        // Остановить сигнал
        function stopAlert() {
            window.speechSynthesis.cancel();
            if (repeatTimerId) {
                clearTimeout(repeatTimerId);
                repeatTimerId = null;
            }
            isSpeakingLoop = false;
            alertOverlay.style.display = 'none';
            currentAlertReminder = null;
        }

        // Показать окно и начать озвучку с повтором
        function triggerAlert(reminder) {
            if (currentAlertReminder) return;
            currentAlertReminder = reminder;
            alertText.textContent = reminder.title;
            alertOverlay.style.display = 'flex';

            function speakAndSchedule() {
                if (!currentAlertReminder) return;
                isSpeakingLoop = true;
                speakText(reminder.title, () => {
                    if (currentAlertReminder && isSpeakingLoop) {
                        repeatTimerId = setTimeout(() => {
                            if (currentAlertReminder && isSpeakingLoop) {
                                speakAndSchedule();
                            }
                        }, 1000);
                    }
                });
            }

            speakAndSchedule();
        }

        // ========== ПРОВЕРКА НАПОМИНАЛОК ==========
        function checkReminders() {
            if (currentAlertReminder) return;

            const now = Date.now();
            let changed = false;

            for (let i = 0; i < reminders.length; i++) {
                const rem = reminders[i];
                if (rem.done) continue;

                const remTime = new Date(rem.time).getTime();
                if (isNaN(remTime)) continue;

                let shouldTrigger = false;

                if (rem.repeat === 'once') {
                    if (!rem.notified && remTime <= now) {
                        shouldTrigger = true;
                        rem.done = true;
                        rem.notified = true;
                    }
                } else {
                    if (remTime <= now) {
                        if (!rem.lastTriggered) {
                            shouldTrigger = true;
                        } else {
                            const period = getPeriodMs(rem.repeat);
                            if (period && (now - rem.lastTriggered) >= period) {
                                shouldTrigger = true;
                            }
                        }
                    }
                }

                if (shouldTrigger) {
                    rem.lastTriggered = now;
                    if (rem.repeat === 'once') {
                        rem.done = true;
                    }
                    changed = true;
                    triggerAlert(rem);
                    break;
                }
            }

            if (changed) {
                saveReminders();
                renderReminders();
            }
        }

        function getPeriodMs(repeat) {
            const periods = {
                minute: 60 * 1000,
                hour: 60 * 60 * 1000,
                day: 24 * 60 * 60 * 1000,
                week: 7 * 24 * 60 * 60 * 1000,
                month: 30 * 24 * 60 * 60 * 1000,
                year: 365 * 24 * 60 * 60 * 1000
            };
            return periods[repeat] || null;
        }

        setInterval(checkReminders, 1000);
        renderReminders();
    </script>
</body>
</html>
